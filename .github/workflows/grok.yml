name: Build PampGram Dylib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Clone Telegram-iOS
      uses: actions/checkout@v4
      with:
        repository: TelegramMessenger/Telegram-iOS
        submodules: recursive
        path: telegram

    - name: Clone PampGram (fud0chka)
      uses: actions/checkout@v4
      with:
        repository: fud0chka/PampGram
        path: pampgram

    - name: Select Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        sudo xcodebuild -license accept
        xcodebuild -version

    - name: Setup Bazelisk
      run: brew install bazelisk

    - name: Apply PampGram mod
      run: |
        cd telegram
        
        # 1. Применяем патч
        git apply --reject --whitespace=fix ../pampgram/mod/telegram-ios.patch || true
        
        # 2. Копируем компоненты мода (как написано в README PampGram)
        mkdir -p submodules/TelegramUI/Components/PampGram
        cp -R ../pampgram/mod/components/. submodules/TelegramUI/Components/PampGram/
        
        echo "=== Компоненты PampGram ==="
        find submodules/TelegramUI/Components/PampGram -type d
        find submodules/TelegramUI/Components/PampGram -name "*.swift" | head -30

    - name: Create config
      run: |
        cd telegram
        mkdir -p build-input
        cat > build-input/data.json << 'EOF'
        {
          "bundle_id": "org.telegram.Telegram-iOS",
          "api_id": "8",
          "api_hash": "7245de8e747a0d6fbe11f7cc14fcc0bb",
          "team_id": "XXXXXXXXXX",
          "app_center_id": "",
          "is_internal_build": "true",
          "is_appstore_build": "false",
          "appstore_id": "0",
          "app_specific_url_scheme": "tg",
          "premium_iap_product_id": "",
          "enable_siri": false,
          "enable_icloud": false
        }
        EOF

    - name: Build PampGram framework
      run: |
        cd telegram
        
        # Пробуем собрать основные модули мода
        python3 build-system/Make/Make.py \
          --overrideXcodeVersion \
          build \
          --configurationPath=build-input/data.json \
          --configuration=release_arm64 \
          --buildNumber=10000 \
          --xcodeManagedCodesigning \
          --target=//submodules/TelegramUI/Components/PampGram/PampGramCore:PampGramCore \
          || true
        
        # Собираем всё, что есть в PampGram
        find submodules/TelegramUI/Components/PampGram -name "BUILD" -exec dirname {} \; | while read dir; do
          target=$(basename "$dir")
          echo "Trying to build $dir:$target"
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-input/data.json \
            --configuration=release_arm64 \
            --buildNumber=10000 \
            --xcodeManagedCodesigning \
            --target="//$dir:$target" || true
        done

    - name: Extract dylib
      run: |
        cd telegram
        
        echo "=== Полный поиск всего, что связано с PampGram ==="
        find bazel-out -iname "*pamp*" 2>/dev/null | head -100
        
        echo ""
        echo "=== Ищем .framework ==="
        find bazel-out -name "*.framework" -type d 2>/dev/null | grep -i pamp || true
        
        echo ""
        echo "=== Ищем .a ==="
        find bazel-out -name "lib*Pamp*.a" 2>/dev/null || true
        
        # Самый вероятный путь к framework
        FRAMEWORK=$(find bazel-out -path "*PampGram*.framework" -type d | head -1)
        
        if [ -z "$FRAMEWORK" ]; then
          # Пробуем найти любой framework, который мы собирали
          FRAMEWORK=$(find bazel-out -name "*.framework" -type d | grep -E "(PampGram|PhantomGift|SettingsUI)" | head -1)
        fi
        
        if [ -n "$FRAMEWORK" ]; then
          echo "Найден framework: $FRAMEWORK"
          ls -la "$FRAMEWORK"
          
          # Бинарник обычно называется так же, как framework без расширения
          BINARY_NAME=$(basename "$FRAMEWORK" .framework)
          
          if [ -f "$FRAMEWORK/$BINARY_NAME" ]; then
            cp "$FRAMEWORK/$BINARY_NAME" ../PampGram.dylib
            echo "Скопировал бинарник: $BINARY_NAME → PampGram.dylib"
          else
            # Иногда бинарник лежит просто как файл внутри
            find "$FRAMEWORK" -type f -perm +111 | head -5
            FIRST_BINARY=$(find "$FRAMEWORK" -type f -perm +111 | head -1)
            if [ -n "$FIRST_BINARY" ]; then
              cp "$FIRST_BINARY" ../PampGram.dylib
              echo "Скопировал: $FIRST_BINARY"
            fi
          fi
        else
          echo "Framework не найден. Пробуем взять статическую библиотеку..."
          LIB=$(find bazel-out -name "libPampGram*.a" | head -1)
          if [ -n "$LIB" ]; then
            cp "$LIB" ../PampGram.a
            echo "Взял статическую библиотеку: $LIB"
          fi
        fi
        
        cd ..
        ls -lh PampGram.* 2>/dev/null || echo "Ничего не извлеклось"

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: PampGram-dylib
        path: |
          PampGram.dylib
          PampGram.a
        if-no-files-found: warn
