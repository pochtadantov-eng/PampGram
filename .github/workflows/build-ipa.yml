name: Build IPA (device, fake-signed)

# Manual only — this is a huge build (Telegram-iOS plus WebRTC/dav1d/libvpx/td from
# source). Run it from the Actions tab when you actually want a new .ipa.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350 # under the 6h hosted-runner cap
    steps:
      - name: Check out PampGram (patch + PhantomGiftKit)
        uses: actions/checkout@v4
        with:
          path: pampgram

      # versions.json pins Xcode 26.2; --overrideXcodeVersion skips the assertion, but the
      # project genuinely needs Xcode 26+ (its app icons use the Icon Composer .icon bundle
      # format). Pick the newest Xcode actually present rather than trusting the image label.
      - name: Select latest available Xcode
        run: |
          ls /Applications | grep -i xcode || true
          latest_xcode="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest_xcode" ]; then sudo xcode-select -s "$latest_xcode"; fi
          xcodebuild -version

      - name: Check out Telegram-iOS
        run: |
          git clone --recursive --shallow-submodules --depth 1 -j8 \
            https://github.com/TelegramMessenger/Telegram-iOS.git telegram-ios

      # mod/components/* are whole new Bazel packages, dropped in as-is under a single
      # PampGram/ directory; mod/telegram-ios.patch only touches files that already exist
      # upstream. Keeping the two apart means editing our own Swift never requires
      # regenerating the patch.
      - name: Apply the PampGram patch
        working-directory: telegram-ios
        run: |
          git apply --check ../pampgram/mod/telegram-ios.patch
          git apply ../pampgram/mod/telegram-ios.patch
          mkdir -p submodules/TelegramUI/Components/PampGram
          cp -R ../pampgram/mod/components/. submodules/TelegramUI/Components/PampGram/
          ls -1 submodules/TelegramUI/Components/PampGram

      # Run 1 compiled the whole app fine, then died at the very last step:
      #   "Unable to find an identity on the system matching the ones in
      #    .../provisioning/Widget.mobileprovision"
      #
      # The shipped certs/SelfSigned.p12 is encrypted with pbeWithSHA1And40BitRC2-CBC —
      # 40-bit RC2, which modern crypto stacks refuse outright (OpenSSL 3 errors with
      # "unsupported: RC2-40-CBC"). ImportCertificates.py calls `security import` with
      # check_result=False, so the failed import is swallowed silently and the build only
      # falls over ~40 minutes later, at signing, with no hint of the real cause.
      #
      # Verified this is the *only* problem: the SHA-1 fingerprint of the cert inside
      # SelfSigned.p12 (D3:45:DE:EE:63:A1:D7:16:F2:23:25:8E:9C:2E:F3:EB:FB:DC:C0:11) matches
      # the DeveloperCertificates entry embedded in the .mobileprovision files exactly, so
      # the signing material itself is self-consistent — it just can't be read as shipped.
      #
      # Re-encrypt it (same key, same cert, only the container changes), then prove it
      # actually yields an identity before spending another 40 minutes compiling.
      #
      # Runs 2 and 3 pinned down the rest. Run 2 failed on -macalg sha256 with
      # "SecKeychainItemImport: MAC verification failed during PKCS12 import (wrong
      # password?)". Run 3 then tried four different PBE/MAC combinations and every single
      # one failed *identically* — which rules the algorithms out: the one thing they all
      # shared was the empty password. That is the long-standing PKCS#12 empty-password
      # ambiguity, where OpenSSL and Apple's Security framework derive the MAC key
      # differently, so Apple computes a different MAC and calls the file corrupt.
      #
      # Run 4 confirmed that: with a password, the 3DES + SHA-1 MAC container reported
      # "1 identity imported." Apple accepts AES-256 containers less reliably here (that
      # variant returned "Unknown format in import"), so 3DES is tried first.
      #
      # Run 4 also exposed a bug in this check itself: it used `security find-identity -v`,
      # and -v lists only identities that pass trust evaluation. A self-signed certificate
      # never does, so the check rejected the very container that had just imported fine.
      # Drop -v and list all identities instead.
      #
      # Giving the container a real password sidesteps the ambiguity entirely. Since
      # ImportCertificates.py hardcodes `security import ... -P ''`, patch it to use the
      # same password. (A password on a .cer is simply ignored, so the other call sites in
      # that script are unaffected.)
      - name: Re-encode the fake signing certificate, and verify it imports
        working-directory: telegram-ios
        run: |
          set -uo pipefail
          openssl version
          P12=build-system/fake-codesigning/certs/SelfSigned.p12
          PASS=pampgram

          # OpenSSL 3 needs -legacy to read the shipped RC2-40 container; LibreSSL (Apple's
          # /usr/bin/openssl) has no such flag but reads it natively — try one, fall back.
          openssl pkcs12 -legacy -in "$P12" -nodes -passin pass: -out /tmp/sc.pem 2>/dev/null \
            || openssl pkcs12 -in "$P12" -nodes -passin pass: -out /tmp/sc.pem
          if [ ! -s /tmp/sc.pem ]; then
            echo "FAIL: could not decrypt the shipped p12 at all."
            exit 1
          fi

          try_variant() {
            desc="$1"; shift
            rm -f /tmp/try.p12
            if ! openssl pkcs12 -export -in /tmp/sc.pem -out /tmp/try.p12 -passout "pass:$PASS" "$@" 2>/dev/null; then
              echo "  [$desc] openssl could not produce this encoding — skipping"
              return 1
            fi
            security delete-keychain preflight.keychain 2>/dev/null || true
            security create-keychain -p preflight preflight.keychain
            security unlock-keychain -p preflight preflight.keychain
            if security import /tmp/try.p12 -k preflight.keychain -P "$PASS" -T /usr/bin/codesign -A 2>&1 \
               && security find-identity preflight.keychain | grep -q 'Telegram FZ-LLC'; then
              echo "  [$desc] imported successfully — using this one"
              cp /tmp/try.p12 "$P12"
              security find-identity preflight.keychain
              security delete-keychain preflight.keychain 2>/dev/null || true
              return 0
            fi
            echo "  [$desc] did not import"
            security delete-keychain preflight.keychain 2>/dev/null || true
            return 1
          }

          echo "--- trying encodings until one imports ---"
          try_variant "3DES + SHA-1 MAC" -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
            || try_variant "AES-256 + SHA-1 MAC" -keypbe AES-256-CBC -certpbe AES-256-CBC -macalg sha1 \
            || try_variant "openssl defaults" \
            || { echo "FAIL: none of the encodings produced an importable identity."; exit 1; }
          rm -f /tmp/sc.pem /tmp/try.p12

          python3 - <<'PYEOF'
          import re
          path = "build-system/Make/ImportCertificates.py"
          src = open(path).read()
          patched, n = re.subn(r"('-P',\s*\n\s*)''", r"\1'pampgram'", src)
          if n == 0:
              raise SystemExit("FAIL: could not find the -P '' arguments to patch")
          open(path, "w").write(patched)
          print(f"Patched {n} occurrence(s) of -P '' in ImportCertificates.py")
          PYEOF

          echo "OK: signing identity is available."

      # The bundle_id and team_id MUST match what's baked into the fake provisioning profiles
      # shipped in build-system/fake-codesigning/profiles/ (Telegram.mobileprovision carries
      # application-identifier C67CF9S4VU.ph.telegra.Telegraph) — a mismatch fails codesigning.
      #
      # api_id/api_hash: get your own free pair at https://my.telegram.org/apps and add them
      # as repo secrets TELEGRAM_API_ID / TELEGRAM_API_HASH. The fallback below is Telegram's
      # own public App Store pair, which is restricted to the official app — logging into a
      # third-party build with it risks the account being limited or banned. Use your own.
      - name: Write build configuration
        working-directory: telegram-ios
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '8' }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || '7245de8e747a0d6fbe11f7cc14fcc0bb' }}
        run: |
          cat > build-system/pampgram-configuration.json <<EOF
          {
            "bundle_id": "ph.telegra.Telegraph",
            "api_id": "${TELEGRAM_API_ID}",
            "api_hash": "${TELEGRAM_API_HASH}",
            "team_id": "C67CF9S4VU",
            "app_center_id": "0",
            "is_internal_build": "false",
            "is_appstore_build": "false",
            "appstore_id": "686449807",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "org.telegram.telegramPremium.monthly",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF
          cat build-system/pampgram-configuration.json

      # Split restore/save instead of actions/cache, because actions/cache only writes the
      # cache when the job succeeds. Every run so far has failed, so nothing was ever saved
      # and each attempt recompiled all ~6000 targets from scratch — roughly 37 minutes to
      # reach our own module, which is the very last thing built. Saving on failure too means
      # a retry only recompiles what actually changed.
      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ~/telegram-bazel-cache
          key: telegram-bazel-cache-${{ github.run_id }}
          restore-keys: |
            telegram-bazel-cache-

      # A DEVICE build (release_arm64), signed with the self-signed cert + fake provisioning
      # profiles the Telegram repo ships in build-system/fake-codesigning for exactly this
      # purpose (README: "Copy build-system/fake-codesigning"). Make.py's ImportCertificates.py
      # creates a temp keychain and imports certs/SelfSigned.p12 (empty password) itself.
      #
      # The resulting signature is NOT valid for installing on a real iPhone as-is. That's
      # fine and expected: Sideloadly / AltStore / an on-device signer strip it and re-sign
      # with YOUR Apple ID at install time. They only need a structurally valid device .ipa,
      # which is what this produces.
      - name: Build device IPA (fake-signed)
        working-directory: telegram-ios
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/pampgram-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=1 \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="$GITHUB_WORKSPACE/output"

      - name: Save Bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/telegram-bazel-cache
          key: telegram-bazel-cache-${{ github.run_id }}

      - name: Show what was produced
        if: always()
        run: ls -lh "$GITHUB_WORKSPACE/output" || echo "no output directory — the build did not reach packaging"

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PampGram-ipa
          path: output/Telegram.ipa
          if-no-files-found: warn
          retention-days: 14
