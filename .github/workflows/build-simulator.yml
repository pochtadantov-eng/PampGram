name: Build (simulator, no signing)

# Manual only — this is a genuinely huge build (Telegram-iOS + WebRTC/dav1d/libvpx/td built
# from source), so we don't want it firing on every push and burning macOS-runner time by
# accident. Run it from the Actions tab when you actually want to check that the mod compiles.
on:
  workflow_dispatch: {}

jobs:
  build:
    # versions.json in Telegram-iOS asks for Xcode 26.2 / macOS 26. The first run landed on
    # a runner with only Xcode 16.4 — --overrideXcodeVersion just skips the version *check*,
    # it can't make an old Xcode understand newer project features (this repo's app icons use
    # the Icon Composer .icon bundle format, Xcode 26+ only). Requesting macos-26 here; if
    # that label doesn't exist yet, replace it with whatever `macos-*` label is currently
    # listed in Settings → Actions → Runners — the "Select latest available Xcode" step below
    # then picks the newest Xcode actually present on whichever image we land on, so it
    # doesn't strictly depend on guessing the exact runner label right.
    runs-on: macos-26
    timeout-minutes: 350 # stay under the 6h hosted-runner hard cap
    steps:
      - name: Check out PampGram (patch + PhantomGiftKit)
        uses: actions/checkout@v4
        with:
          path: pampgram

      - name: Select latest available Xcode
        run: |
          ls /Applications | grep -i xcode || true
          latest_xcode="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$latest_xcode" ]; then
            echo "No /Applications/Xcode_*.app found — falling back to whatever xcode-select already points at."
          else
            sudo xcode-select -s "$latest_xcode"
          fi
          xcodebuild -version

      - name: Check out Telegram-iOS
        run: |
          git clone --recursive --shallow-submodules --depth 1 -j8 \
            https://github.com/TelegramMessenger/Telegram-iOS.git telegram-ios

      - name: Apply the PampGram patch
        working-directory: telegram-ios
        run: |
          git apply --check ../pampgram/mod/phantom-gift/telegram-ios.patch
          git apply ../pampgram/mod/phantom-gift/telegram-ios.patch
          cp -r ../pampgram/mod/phantom-gift/PhantomGiftKit \
            submodules/TelegramUI/Components/Gifts/PhantomGiftKit

      # Four runs in a row failed with "Building for device, but no provisioning_profile
      # attribute was set" despite --disableProvisioningProfiles, --xcodeManagedCodesigning,
      # and appending the flag to every xcodeproj.bazelrc I could find (there are at least
      # three in play across this build — a root one, one nested inside the generated
      # .xcodeproj, and one rules_xcodeproj writes fresh into a randomized temp dir on every
      # single invocation, whose path can't be predicted or pre-patched). Rather than keep
      # chasing which bazelrc a given sub-invocation reads, patch the actual source of the
      # ambiguity directly: Telegram/BUILD's `ios_application(name = "Telegram", ...)` sets
      # provisioning_profile via a select() keyed on that same disableProvisioningProfiles
      # build_setting, which evidently isn't reliably reaching every analysis of this target.
      # Hardcoding it to None removes the select (and the build_setting dependency) entirely,
      # so the config-propagation question stops mattering. Simulator-only, CI-only — not
      # something to ever do in a real signed build.
      - name: Hardcode provisioning_profile = None for the Telegram target
        working-directory: telegram-ios
        run: |
          python3 - <<'EOF'
          path = "Telegram/BUILD"
          with open(path) as f:
              content = f.read()
          old = "    provisioning_profile = select({\n        \":disableProvisioningProfilesSetting\": None,\n        \"//conditions:default\": \":Telegram_xcode_profile\" if telegram_use_xcode_managed_codesigning else \"@build_configuration//provisioning:Telegram.mobileprovision\",\n    }),"
          count = content.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly 1 match for the Telegram ios_application provisioning_profile block, found {count} — Telegram/BUILD must have changed upstream, needs a fresh look")
          content = content.replace(old, "    provisioning_profile = None,  # PampGram CI: unsigned simulator build only")
          with open(path, "w") as f:
              f.write(content)
          print("Patched provisioning_profile = None for //Telegram:Telegram")
          EOF

      - name: Write build configuration
        working-directory: telegram-ios
        env:
          # Free, per-app credentials from https://my.telegram.org/apps — put your own in
          # this repo's Settings → Secrets → Actions as TELEGRAM_API_ID / TELEGRAM_API_HASH
          # if you want a build that can actually log in. Placeholder values below are
          # enough to just verify the code compiles.
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '1' }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || '00000000000000000000000000000000' }}
        run: |
          # team_id must be non-empty even with --disableProvisioningProfiles: the
          # xcode_provisioning_profile Bazel rule hard-fails otherwise ("team_id must be
          # set"), regardless of whether it's a real registered Apple Team ID. This one
          # isn't real — just 10 characters in the right shape.
          cat > build-system/pampgram-ci-configuration.json <<EOF
          {
            "bundle_id": "org.pampgram.ci.Telegram",
            "api_id": "${TELEGRAM_API_ID}",
            "api_hash": "${TELEGRAM_API_HASH}",
            "team_id": "PMPGRM0001",
            "app_center_id": "0",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF

      - name: Cache Bazel build outputs
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          # No Package.resolved/lockfile to hash here, so the key just tracks the patch —
          # a cache miss only costs the normal cold-build time, never correctness.
          key: telegram-bazel-cache-${{ hashFiles('pampgram/mod/phantom-gift/telegram-ios.patch') }}
          restore-keys: |
            telegram-bazel-cache-

      # IMPORTANT: `Make.py build` always requires picking a real codesigning source
      # (--gitCodesigningRepository / --codesigningInformationPath / --xcodeManagedCodesigning
      # — argparse enforces exactly one, no "skip signing" option on that subcommand).
      # --disableProvisioningProfiles only exists on `generateProject`, which just emits an
      # .xcodeproj and (locally) opens it in Xcode.app — it does not compile anything itself.
      # So this is a genuine two-step, CI-adapted flow: generate an unsigned project with
      # --xcodeManagedCodesigning (the only one of the three that needs no pre-existing
      # certs/secrets) + --disableProvisioningProfiles, then compile it with `xcodebuild`
      # directly against the iOS Simulator SDK.
      - name: Generate Xcode project (unsigned, simulator-only)
        working-directory: telegram-ios
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$HOME/telegram-bazel-cache" \
            generateProject \
            --configurationPath=build-system/pampgram-ci-configuration.json \
            --xcodeManagedCodesigning \
            --disableProvisioningProfiles \
            --buildNumber=1

      # `generateProject` ends by running `open Telegram/Telegram.xcodeproj`, which on a
      # headless CI runner either fails or launches Xcode.app pointlessly in the background —
      # neither matters, but make sure it doesn't hang the job waiting on a GUI.
      - name: Close Xcode if generateProject opened it
        if: always()
        run: killall Xcode || true

      # Upstream bug, verified by reading build-system/Make/ProjectGeneration.py: the
      # generateProject subcommand accepts --disableProvisioningProfiles and threads it all
      # the way down to generate_xcodeproj()'s disable_provisioning_profiles parameter, but
      # that parameter is never actually turned into the --//Telegram:disableProvisioningProfiles
      # Bazel flag anywhere in that function (unlike disableExtensions/disableStripping, which
      # both do get added). Only the `build`/`build_spm` subcommands' own invoke_build() /
      # invoke_spm_build() add that flag — generateProject's separately-invoked bazel run never
      # does, so the xcodeproj.bazelrc it writes is missing it, and xcodebuild later still goes
      # looking for a real local provisioning profile. Appending the flag ourselves, since we
      # know the correct name.
      # Runs #8 and #9 (COMPILER_INDEX_STORE_ENABLE=NO) still failed with the *exact* same
      # "Building for device" error, unchanged down to the Bazel config hash (c357481) — proof
      # the appended line was never actually being read by the failing invocation. The build
      # logs show a SECOND xcodeproj.bazelrc nested at
      # Telegram/Telegram.xcodeproj/rules_xcodeproj/bazel/xcodeproj.bazelrc ("Found applicable
      # config definition ... in file .../Telegram.xcodeproj/rules_xcodeproj/bazel/
      # xcodeproj.bazelrc") — a copy made at generateProject time that the embedded
      # "Generate Bazel Dependencies" script phases read at actual xcodebuild time, not the
      # root-level file I'd been appending to. Appending to both now.
      - name: Work around missing --disableProvisioningProfiles in generated project
        working-directory: telegram-ios
        run: |
          echo 'build --//Telegram:disableProvisioningProfiles' >> xcodeproj.bazelrc
          find Telegram/Telegram.xcodeproj -name 'xcodeproj.bazelrc' -print
          find Telegram/Telegram.xcodeproj -name 'xcodeproj.bazelrc' -exec sh -c 'echo "build --//Telegram:disableProvisioningProfiles" >> "$1"' _ {} \;

      # Uncertain step, flagged honestly: I couldn't verify the generated project's exact
      # scheme name without macOS to run this on. `-list` prints the real scheme names into
      # the log first — if "Telegram" below is wrong, this log tells you the right one for a
      # one-line fix, instead of another blind guess.
      - name: List schemes (diagnostic)
        working-directory: telegram-ios
        run: xcodebuild -list -project Telegram/Telegram.xcodeproj || true

      # Run #5 failed with "Building for device, but no provisioning_profile attribute was
      # set" — the --disableProvisioningProfiles fix from the previous PR did correctly clear
      # provisioning_profile, but the generic `-destination 'generic/platform=iOS Simulator'`
      # wasn't reliably reaching this rules_xcodeproj/Bazel platform-transition setup, and it
      # got analyzed as a device build anyway. `-sdk iphonesimulator` is the more direct,
      # classic way to force the simulator SDK for a build-only (non-run) invocation — no
      # destination matching involved.
      # Run #7 (with -sdk iphonesimulator) failed the same way as run #5 did: "Building for
      # device, but no provisioning_profile attribute was set." Neither -destination nor -sdk
      # actually decide this — the log shows Xcode/rules_xcodeproj also runs a separate,
      # parallel "Index Build" (for editor code-completion/navigation), whose own generated
      # script phase ("Copy Bazel Outputs / Generate Bazel Dependencies (Index Build)", visible
      # in the log) resolves to a device-flavored Bazel config independent of the SDK/
      # destination we pass for the real build — and that side build's failure fails the whole
      # xcodebuild invocation. COMPILER_INDEX_STORE_ENABLE=NO is the standard xcodebuild
      # override to turn this parallel Index Build off.
      - name: Build (simulator, unsigned)
        working-directory: telegram-ios
        run: |
          xcodebuild build \
            -project Telegram/Telegram.xcodeproj \
            -scheme Telegram \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Upload built .app (simulator-only — not installable on a real iPhone)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-pampgram-simulator-build
          path: |
            telegram-ios/Telegram/Telegram.xcodeproj
            /Users/runner/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
          if-no-files-found: warn
          retention-days: 7
