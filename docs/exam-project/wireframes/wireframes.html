<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PampGram · wireframes</title>
  <style>
    :root {
      --bg:#f4f5fa; --ink:#0f1226; --mut:#7a80a0; --line:#d7dbef; --fill:#eceff9;
      --acc:#e9d9ff; --acc2:#d9f0ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 32px;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Manrope, sans-serif;
      background: var(--bg); color: var(--ink);
    }
    h1 { margin: 0 0 4px; font-size: 26px; }
    .meta { color: var(--mut); margin: 0 0 32px; }
    .grid {
      display: grid; gap: 32px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      align-items: start;
    }
    figure {
      margin: 0; padding: 20px; background: #fff;
      border: 1px solid var(--line); border-radius: 16px;
    }
    figcaption {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 12px;
    }
    figcaption b { font-size: 16px; }
    figcaption span { color: var(--mut); font-size: 12px; }
    svg { width: 100%; height: auto; display: block; background: #f9faff;
          border-radius: 10px; border: 1px dashed var(--line); }

    /* wireframe primitives (used inside <svg>) */
    .wf-box    { fill: var(--fill); stroke: var(--line); stroke-width: 1; }
    .wf-acc    { fill: var(--acc); stroke: var(--line); stroke-width: 1; }
    .wf-acc2   { fill: var(--acc2); stroke: var(--line); stroke-width: 1; }
    .wf-line   { stroke: var(--line); stroke-width: 1; fill: none; }
    .wf-txt    { fill: var(--ink); font-size: 11px; font-family: inherit; }
    .wf-mut    { fill: var(--mut); font-size: 10px; font-family: inherit; }
    .wf-cap    { fill: var(--ink); font-size: 12px; font-weight: 600; font-family: inherit; }

    .legend { margin-top: 24px; font-size: 12px; color: var(--mut); }
    .legend span { display: inline-block; padding: 4px 10px; border-radius: 6px;
                    background: var(--fill); border: 1px solid var(--line); margin-right: 6px; }
    .legend .a  { background: var(--acc); }
    .legend .b  { background: var(--acc2); }

    @media print {
      body { padding: 12mm; }
      figure { break-inside: avoid; page-break-inside: avoid; }
    }
  </style>
</head>
<body>

<h1>PampGram · wireframes интернет-страницы</h1>
<p class="meta">Стационарный ПК · Планшет · Мобильное устройство. Low-fidelity, ч/б,
без графики — только структура и иерархия элементов.</p>

<div class="grid">

  <!-- ─────────── DESKTOP ─────────── -->
  <figure>
    <figcaption><b>Desktop</b><span>1440 × 3200 px</span></figcaption>
    <svg viewBox="0 0 720 1600" role="img" aria-label="Desktop wireframe">
      <!-- header -->
      <rect class="wf-box" x="20" y="20" width="680" height="56" rx="8"/>
      <rect class="wf-acc" x="36" y="36" width="80" height="24" rx="4"/>
      <text class="wf-cap" x="76" y="52" text-anchor="middle">LOGO</text>
      <rect class="wf-line" x="260" y="40" width="60" height="16"/>
      <rect class="wf-line" x="330" y="40" width="60" height="16"/>
      <rect class="wf-line" x="400" y="40" width="60" height="16"/>
      <rect class="wf-line" x="470" y="40" width="60" height="16"/>
      <rect class="wf-acc2" x="600" y="36" width="86" height="24" rx="12"/>
      <text class="wf-cap" x="643" y="52" text-anchor="middle">CTA</text>

      <!-- hero -->
      <rect class="wf-box" x="20" y="96" width="680" height="360" rx="8"/>
      <rect class="wf-line" x="40" y="120" width="140" height="18"/>
      <rect class="wf-line" x="40" y="150" width="340" height="34"/>
      <rect class="wf-line" x="40" y="192" width="300" height="34"/>
      <rect class="wf-line" x="40" y="242" width="360" height="52"/>
      <rect class="wf-acc"  x="40"  y="308" width="120" height="36" rx="18"/>
      <rect class="wf-line" x="170" y="308" width="140" height="36" rx="18"/>
      <rect class="wf-line" x="40"  y="360" width="360" height="70" rx="10"/>
      <text class="wf-mut"  x="220" y="400" text-anchor="middle">stats · 4 колонки</text>
      <rect class="wf-acc2" x="440" y="120" width="240" height="316" rx="24"/>
      <text class="wf-mut"  x="560" y="280" text-anchor="middle">phone mock</text>

      <!-- advantages -->
      <text class="wf-cap" x="360" y="490" text-anchor="middle">SECTION · ADVANTAGES</text>
      <g transform="translate(20 500)">
        <rect class="wf-box" x="0"   y="0" width="165" height="140" rx="8"/>
        <rect class="wf-box" x="172" y="0" width="165" height="140" rx="8"/>
        <rect class="wf-box" x="344" y="0" width="165" height="140" rx="8"/>
        <rect class="wf-box" x="516" y="0" width="164" height="140" rx="8"/>
        <text class="wf-mut" x="82"  y="76" text-anchor="middle">card 1</text>
        <text class="wf-mut" x="254" y="76" text-anchor="middle">card 2</text>
        <text class="wf-mut" x="426" y="76" text-anchor="middle">card 3</text>
        <text class="wf-mut" x="598" y="76" text-anchor="middle">card 4</text>
      </g>

      <!-- catalog -->
      <text class="wf-cap" x="360" y="680" text-anchor="middle">SECTION · CATALOG (фильтр + карточки)</text>
      <rect class="wf-line" x="20" y="694" width="200" height="26" rx="4"/>
      <g transform="translate(20 730)">
        <g id="cc">
          <rect class="wf-box" x="0" y="0" width="220" height="180" rx="8"/>
          <rect class="wf-acc" x="0" y="0" width="220" height="90"/>
          <rect class="wf-line" x="12" y="102" width="60"  height="10"/>
          <rect class="wf-line" x="12" y="120" width="180" height="14"/>
          <rect class="wf-line" x="12" y="142" width="196" height="10"/>
          <rect class="wf-line" x="12" y="156" width="140" height="10"/>
        </g>
        <use href="#cc" x="230"/>
        <use href="#cc" x="460"/>
      </g>

      <!-- compare table -->
      <text class="wf-cap" x="360" y="960" text-anchor="middle">SECTION · COMPARE TABLE</text>
      <rect class="wf-box" x="20" y="976" width="680" height="200" rx="8"/>
      <line class="wf-line" x1="20" y1="1010" x2="700" y2="1010"/>
      <line class="wf-line" x1="20" y1="1044" x2="700" y2="1044"/>
      <line class="wf-line" x1="20" y1="1078" x2="700" y2="1078"/>
      <line class="wf-line" x1="20" y1="1112" x2="700" y2="1112"/>
      <line class="wf-line" x1="20" y1="1146" x2="700" y2="1146"/>
      <line class="wf-line" x1="220" y1="976" x2="220" y2="1176"/>
      <line class="wf-line" x1="330" y1="976" x2="330" y2="1176"/>
      <line class="wf-line" x1="430" y1="976" x2="430" y2="1176"/>
      <line class="wf-line" x1="530" y1="976" x2="530" y2="1176"/>
      <line class="wf-line" x1="610" y1="976" x2="610" y2="1176"/>
      <rect class="wf-acc" x="610" y="976" width="90" height="200"/>

      <!-- install + download -->
      <text class="wf-cap" x="360" y="1210" text-anchor="middle">SECTION · INSTALL + DOWNLOAD</text>
      <rect class="wf-box" x="20"  y="1226" width="420" height="240" rx="8"/>
      <rect class="wf-line" x="40"  y="1246" width="200" height="24"/>
      <rect class="wf-line" x="40"  y="1284" width="360" height="42" rx="6"/>
      <rect class="wf-line" x="40"  y="1334" width="360" height="42" rx="6"/>
      <rect class="wf-line" x="40"  y="1384" width="360" height="42" rx="6"/>
      <rect class="wf-acc2" x="460" y="1226" width="240" height="240" rx="8"/>
      <text class="wf-mut"  x="580" y="1350" text-anchor="middle">download card</text>

      <!-- footer -->
      <rect class="wf-box" x="20" y="1500" width="680" height="80" rx="8"/>
      <text class="wf-mut" x="360" y="1544" text-anchor="middle">footer · 4 колонки</text>
    </svg>
  </figure>

  <!-- ─────────── TABLET ─────────── -->
  <figure>
    <figcaption><b>Tablet</b><span>768 × 3800 px</span></figcaption>
    <svg viewBox="0 0 500 1900" role="img" aria-label="Tablet wireframe">
      <rect class="wf-box" x="20" y="20" width="460" height="56" rx="8"/>
      <rect class="wf-acc" x="36" y="36" width="80" height="24" rx="4"/>
      <text class="wf-cap" x="76" y="52" text-anchor="middle">LOGO</text>
      <rect class="wf-line" x="240" y="40" width="50" height="16"/>
      <rect class="wf-line" x="300" y="40" width="50" height="16"/>
      <rect class="wf-line" x="360" y="40" width="50" height="16"/>
      <rect class="wf-acc2" x="420" y="36" width="52" height="24" rx="12"/>

      <!-- hero: text on top, phone below -->
      <rect class="wf-box" x="20" y="96" width="460" height="440" rx="8"/>
      <rect class="wf-line" x="40" y="120" width="120" height="18"/>
      <rect class="wf-line" x="40" y="150" width="360" height="34"/>
      <rect class="wf-line" x="40" y="192" width="320" height="34"/>
      <rect class="wf-line" x="40" y="242" width="380" height="60"/>
      <rect class="wf-acc"  x="40" y="316" width="140" height="36" rx="18"/>
      <rect class="wf-line" x="190" y="316" width="140" height="36" rx="18"/>
      <rect class="wf-acc2" x="150" y="368" width="200" height="150" rx="20"/>
      <text class="wf-mut"  x="250" y="450" text-anchor="middle">phone mock</text>

      <!-- advantages 2x2 -->
      <text class="wf-cap" x="250" y="570" text-anchor="middle">ADVANTAGES · 2×2</text>
      <g transform="translate(20 584)">
        <rect class="wf-box" x="0"   y="0"   width="225" height="130" rx="8"/>
        <rect class="wf-box" x="235" y="0"   width="225" height="130" rx="8"/>
        <rect class="wf-box" x="0"   y="140" width="225" height="130" rx="8"/>
        <rect class="wf-box" x="235" y="140" width="225" height="130" rx="8"/>
      </g>

      <!-- catalog 2 cols -->
      <text class="wf-cap" x="250" y="880" text-anchor="middle">CATALOG · 2 колонки</text>
      <g transform="translate(20 894)">
        <g id="tc">
          <rect class="wf-box" x="0" y="0" width="225" height="180" rx="8"/>
          <rect class="wf-acc" x="0" y="0" width="225" height="90"/>
        </g>
        <use href="#tc" x="235"/>
        <use href="#tc" y="190"/>
        <use href="#tc" x="235" y="190"/>
        <use href="#tc" y="380"/>
        <use href="#tc" x="235" y="380"/>
      </g>

      <!-- compare (scroll) -->
      <text class="wf-cap" x="250" y="1500" text-anchor="middle">COMPARE · горизонт. скролл</text>
      <rect class="wf-box" x="20" y="1516" width="460" height="140" rx="8"/>
      <text class="wf-mut" x="250" y="1590" text-anchor="middle">table overflow-x: auto →</text>

      <!-- form -->
      <text class="wf-cap" x="250" y="1690" text-anchor="middle">SUBSCRIBE · форма</text>
      <rect class="wf-box" x="20" y="1706" width="460" height="140" rx="8"/>

      <!-- footer -->
      <rect class="wf-box" x="20" y="1860" width="460" height="30" rx="6"/>
    </svg>
  </figure>

  <!-- ─────────── MOBILE ─────────── -->
  <figure>
    <figcaption><b>Mobile</b><span>375 × 4200 px</span></figcaption>
    <svg viewBox="0 0 260 2400" role="img" aria-label="Mobile wireframe">
      <!-- header (compact, hamburger) -->
      <rect class="wf-box" x="10" y="10" width="240" height="48" rx="8"/>
      <rect class="wf-acc" x="20" y="22" width="60" height="24" rx="4"/>
      <rect class="wf-line" x="210" y="22" width="32" height="24" rx="6"/>

      <!-- hero single col -->
      <rect class="wf-box" x="10" y="68" width="240" height="560" rx="8"/>
      <rect class="wf-line" x="24" y="86" width="120" height="14"/>
      <rect class="wf-line" x="24" y="108" width="200" height="32"/>
      <rect class="wf-line" x="24" y="148" width="180" height="32"/>
      <rect class="wf-line" x="24" y="196" width="216" height="80"/>
      <rect class="wf-acc"  x="24" y="290" width="216" height="36" rx="18"/>
      <rect class="wf-line" x="24" y="334" width="216" height="36" rx="18"/>
      <rect class="wf-acc2" x="60" y="388" width="140" height="220" rx="20"/>
      <text class="wf-mut"  x="130" y="500" text-anchor="middle">phone</text>

      <!-- advantages: stacked -->
      <text class="wf-cap" x="130" y="656" text-anchor="middle">ADVANTAGES · stacked</text>
      <g transform="translate(10 668)">
        <rect class="wf-box" x="0" y="0"   width="240" height="80" rx="8"/>
        <rect class="wf-box" x="0" y="90"  width="240" height="80" rx="8"/>
        <rect class="wf-box" x="0" y="180" width="240" height="80" rx="8"/>
        <rect class="wf-box" x="0" y="270" width="240" height="80" rx="8"/>
      </g>

      <!-- catalog 1 col -->
      <text class="wf-cap" x="130" y="1060" text-anchor="middle">CATALOG · 1 колонка</text>
      <g transform="translate(10 1072)">
        <g id="mc">
          <rect class="wf-box" x="0" y="0" width="240" height="200" rx="8"/>
          <rect class="wf-acc" x="0" y="0" width="240" height="100"/>
        </g>
        <use href="#mc" y="0"/>
        <use href="#mc" y="210"/>
        <use href="#mc" y="420"/>
      </g>

      <!-- compare (scroll) -->
      <text class="wf-cap" x="130" y="1730" text-anchor="middle">COMPARE · scroll →</text>
      <rect class="wf-box" x="10" y="1744" width="240" height="120" rx="8"/>

      <!-- install steps stacked -->
      <text class="wf-cap" x="130" y="1900" text-anchor="middle">INSTALL · steps</text>
      <rect class="wf-box" x="10" y="1912" width="240" height="220" rx="8"/>
      <rect class="wf-acc2" x="10" y="2144" width="240" height="140" rx="8"/>
      <text class="wf-mut" x="130" y="2210" text-anchor="middle">download card</text>

      <!-- footer -->
      <rect class="wf-box" x="10" y="2320" width="240" height="70" rx="8"/>
    </svg>
  </figure>

</div>

<p class="legend">
  <span>основной блок</span>
  <span class="a">брендовый / CTA</span>
  <span class="b">изображение / иллюстрация</span>
</p>

</body>
</html>
